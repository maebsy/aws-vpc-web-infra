name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Static checks (no AWS account needed)
        run: bash tests/run-tests.sh
